<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="7" fill="#0b1120" />
  <!--
    Two cards, no inner detail. A favicon is read at 16px, where a letterform or
    a pip turns to mush; a two-tone silhouette still says "cards".
